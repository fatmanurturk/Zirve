version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: zirve_db
    environment:
      POSTGRES_USER: zirve
      POSTGRES_PASSWORD: zirve123
      POSTGRES_DB: zirve_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zirve -d zirve_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: zirve_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
